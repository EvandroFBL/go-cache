services:
  cache:
    build: .
    container_name: go-cache
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - CLEANUP_INTERVAL=10s
      - MAX_KEYS=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
